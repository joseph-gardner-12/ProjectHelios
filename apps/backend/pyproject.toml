[project]
name = "project-helios-backend"
version = "0.1.0"
description = "Project Helios Django backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "channels-redis>=4.3,<5",
    "channels[daphne]>=4.3,<5",
    "django>=6.0,<6.1",
    "django-cors-headers>=4.9,<5",
    "psycopg[binary]>=3.2,<4",
    "redis>=6,<9",
]

[dependency-groups]
dev = [
    "jsonschema[format]>=4,<5",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
