[project]
name = "project-helios-backend"
version = "0.1.0"
description = "Project Helios Django backend"
requires-python = ">=3.14,<3.15"
dependencies = ["django>=6.0,<6.1"]

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
